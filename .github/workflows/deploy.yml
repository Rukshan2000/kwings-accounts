name: CI/CD

on:
  pull_request:
  push:
    branches: [main, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/rukshan2000/kwings-accounts-api
  WEB_IMAGE: ghcr.io/rukshan2000/kwings-accounts-web

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kwings_accounts_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: kwings_accounts_test
      TEST_DB_DATABASE: kwings_accounts_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Migrate
        run: npm run migrate
      - name: Migration rollback + reapply
        run: npm run migrate:rollback && npm run migrate && npm run seed
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  images:
    name: Build & push images
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to production
    needs: images
    # Self-hosted runner on the VPS (label "kwings-prod"): it polls GitHub outbound, so no inbound SSH is needed.
    runs-on: [self-hosted, kwings-prod]
    environment:
      name: production
      url: https://accounts.kwingsmedia.com
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: /opt/kwings-accounts
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose file and scripts
        run: |
          install -m 644 docker-compose.prod.yml "$APP_DIR/"
          install -m 755 deploy/deploy.sh packages/db/docker/init-app-role.sh "$APP_DIR/"
      - name: Pull, migrate, switch
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker" # keep GHCR credentials out of the runner user's home
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          "$APP_DIR/deploy.sh" deploy "${{ github.sha }}"
      - name: Smoke tests
        run: |
          for i in $(seq 1 10); do
            curl -fsS https://accounts.kwingsmedia.com/api/health && \
            curl -fsS -o /dev/null https://accounts.kwingsmedia.com/login && exit 0
            sleep 5
          done
          echo "Smoke tests failed" && exit 1
