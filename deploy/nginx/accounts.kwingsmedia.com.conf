# /etc/nginx/sites-available/accounts.kwingsmedia.com
# New site file only: does not touch other sites on this server.
# Before Certbot runs, only the port-80 server block is needed; `certbot --nginx` adds the certificate lines.

map $http_upgrade $kwings_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream kwings_accounts_web { server 127.0.0.1:3020; keepalive 16; }
upstream kwings_accounts_api { server 127.0.0.1:4020; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name accounts.kwingsmedia.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name accounts.kwingsmedia.com;

    ssl_certificate     /etc/letsencrypt/live/accounts.kwingsmedia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounts.kwingsmedia.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $kwings_connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    location /api/ {
        proxy_pass http://kwings_accounts_api;
    }

    location /_next/static/ {
        proxy_pass http://kwings_accounts_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://kwings_accounts_web;
    }
}
